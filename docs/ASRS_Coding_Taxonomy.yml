# ASRS Coding Taxonomy — machine-readable reference
# Source: ASRS Coding Form, April 2024 revision (16 pages), extracted 2026-09-22.
# Structure: section -> field -> allowed_values
# Field annotations:
#   cardinality: single (Q1 marker on the form) | multi (Q marker) | free (write-in / fill-in)
#   Values ending in " (other)" denote a write-in option present on the form.
# Note: single/multi is inferred from the form's Q1/Q markers; spot-check against
# an actual CSV export before relying on it programmatically.

# analysis of ASRS_CodingForm.pdf by Vibe (22/09/2026)

time:
  date:
    cardinality: free
    values: [yyyymm]
  local_time_of_day:
    cardinality: single
    values: ["0001-0600", "0601-1200", "1201-1800", "1801-2400"]

place:
  locale_reference:
    cardinality: multi
    values: [airport_id, navaid_id_and_type, intersection_id, atc_facility_id_and_type]
  state_reference:
    cardinality: single
    values: [state]
  relative_position:
    cardinality: free
    values: [radial, distance_nautical_miles]
  altitude:
    cardinality: free
    values: [agl_single_value, msl_single_value]

environment:
  flight_conditions:
    cardinality: single
    values: [VMC, IMC, Mixed, Marginal]
  weather_elements_visibility:
    cardinality: multi
    values: [Cloudy, Fog, Hail, Haze/Smoke, Icing, Rain, Snow, Thunderstorm, Turbulence, Windshear, Other, Visibility_SM]
  work_environment_factors:
    cardinality: multi
    values: [Poor Lighting, Glare, Temperature-Extreme, Excessive Humidity, Excessive Wind (UAS)]
  light:
    cardinality: single
    values: [Dawn, Daylight, Dusk, Night]
  ceiling:
    cardinality: free
    values: [CLR_single_value]
  rvr:
    cardinality: free
    values: [single_value]

